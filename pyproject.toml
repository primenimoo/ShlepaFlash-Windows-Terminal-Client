[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shlepaflash-desktop"
version = "1.0.2"
description = "Windows terminal firmware client for the ShlepaFlash catalogue"
readme = "README_RU.md"
requires-python = ">=3.11"
license = { text = "All rights reserved" }
authors = [{ name = "ShlepaFlash" }]
dependencies = [
  "textual>=1.0,<2.0",
  "httpx>=0.27",
  "pyserial>=3.5",
  "Pillow>=10",
  "esptool>=5.0,<6.0",
]

[project.scripts]
shlepaflash = "shlepaflash.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
